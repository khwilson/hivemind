<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hivemind · Repository work queues</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#"><span class="brand-icon">h</span>hivemind<span class="brand-dot">.</span></a>
    <div class="workspace">WORKSPACE <span>LOCAL</span></div>
    <button class="nav selected" id="home-nav"><span>▦</span> Projects <b id="project-count">0</b></button>
    <div class="sidebar-note"><span class="pulse"></span> Built for continuous work<p>One repository.<br>Many agents. Shared context.</p></div>
    <button class="identity" id="auth-button"><span class="avatar">H</span><span id="identity-label">Connect your workspace<small>Administrator or agent token</small></span><span>↗</span></button>
  </aside>
  <div class="shell">
    <header><div id="breadcrumb">Workspace <span>/</span> Projects</div><div class="header-actions"><span class="local-label">LOCAL PROTOTYPE</span><button class="icon-button" id="refresh" aria-label="Refresh projects">↻</button></div></header>
    <main id="main"></main>
    <footer><span><span class="pulse"></span> <span id="connection">Connect to load your queue</span></span><span>GitHub is the source of evidence.</span></footer>
  </div>
  <dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button id="close-modal" class="icon-button" aria-label="Close dialog">×</button></div><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
