[project]
name = "ghapi-typing-prototype"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ghapi==2.1.4",
  "pydantic==2.13.4",
  "datamodel-code-generator==0.83.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "ty>=0.0.1,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
include = ["generate.py", "verify.py", "generated", "tests"]
