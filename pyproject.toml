[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind"
version = "0.1.2"
description = "Standalone GitHub work queues and repository setup for authorized agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "sqlmodel>=0.0.22,<1", "cryptography>=44,<50", "tomlkit>=0.13,<1", "ghapi>=2.1.4,<2.2", "httpx2>=2.13.1,<3"]

[project.optional-dependencies]
relay = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1", "ty>=0.0.1,<1", "pyyaml>=6,<7"]

[project.scripts]
hivemind = "hivemind.cli:app"

[tool.setuptools]
packages = ["hivemind", "hivemind.web"]

[tool.setuptools.package-data]
hivemind = ["web/*.html", "web/*.css", "web/*.js", "templates/*.md", "templates/*.yml", "templates/skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".uv-cache", ".npm-cache", "node_modules", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
include = ["hivemind", "tests", "scripts"]
